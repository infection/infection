services:
  # May require you to login to ghcr.io first:
  # $ docker login ghcr.io --username=<username>
  # If you need a token, a short-lived classic token with read:packages is enough.
  zizmor:
    image: ghcr.io/zizmorcore/zizmor:1.33.1
    command: --quiet --quiet --min-severity=low .github
    working_dir: /opt/infection
    volumes:
      - .:/opt/infection

  php83:
    build:
      context: devTools
      args:
        PHP_VERSION: '8.3'
        XDEBUG_VERSION: '3.4.1'
    volumes:
      - .:/opt/infection

  php84:
    build:
      context: devTools
      args:
        PHP_VERSION: '8.4'
        XDEBUG_VERSION: '3.4.0'
    volumes:
      - .:/opt/infection

  php85:
    build:
      context: devTools
      args:
        PHP_VERSION: '8.5'
        XDEBUG_VERSION: '3.5.1'
    volumes:
      - .:/opt/infection

  # turbocov (https://github.com/shipmonk-rnd/turbocov) as the only coverage
  # driver: no Xdebug nor PCOV installed. Requires PHP 8.4+ and PHPUnit 13.3+.
  php84-turbocov:
    build:
      context: devTools
      dockerfile: Dockerfile.turbocov
      args:
        PHP_VERSION: '8.4'
        TURBOCOV_VERSION: '0.1.1'
    volumes:
      - .:/opt/infection

  php86:
    build:
      context: devTools
      args:
        PHP_VERSION: '8.6-rc'
        XDEBUG_VERSION: '3.6.0alpha1'
    volumes:
      - .:/opt/infection
