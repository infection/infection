name: Sandbox kits

on:
  pull_request:
    paths:
      - .github/workflows/sbx-image.yaml
      - Makefile
      - devTools/sbx/**
  push:
    branches:
      - main
      - master
  release:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sbx-image-status:
    name: Docker Sandbox Image Status
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The kit frontend validates sources while building; no sbx login is needed.
      # Runtime checks use make sbx-kit-test separately.
      #
      # We do this instead of `make sbx-kit-validate` because at the time of writing
      # we cannot configure a kit builder when using `sbx kit validate --offline`
      # which makes the validation fail as sbx cannot build the kit.
      - name: Validate sandbox kits
        run: |
          set -euo pipefail
          for kit_dir in devTools/sbx/kits/*; do
            kit_name="${kit_dir##*/}"
            kit_spec="${kit_dir}/${kit_name}.yaml"
            if [[ "$kit_name" == project-local || ! -f "$kit_spec" ]]; then
              continue
            fi
            docker buildx build \
              --file="$kit_spec" \
              --output=type=cacheonly \
              "$kit_dir"
          done
