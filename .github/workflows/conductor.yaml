# See the Conductor setup guide at https://packagist.com/docs/conductor/getting-started

on:
  repository_dispatch:
    types:
      - dependency_update

name: Private Packagist Conductor

permissions:
  contents: write

jobs:
  conductor:
    name: Private Packagist Conductor
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    env:
      COMPOSER_AUTH: ${{ secrets.CONDUCTOR_COMPOSER_AUTH }}

    steps:
      - name: Checkout
        # zizmor: ignore[artipacked] Conductor updates dependencies and needs the checkout token persisted for repository writes.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PHP
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # master
        with:
          php-version: "8.3"

      - name: "Running Conductor"
        uses: packagist/conductor-github-action@a20e46b1c1449a070539670a20087629b8eb0fd9 # 1.7.0
