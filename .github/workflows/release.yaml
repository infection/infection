name: Release

on:
  push:
    tags:
      - '*'

permissions: {}

jobs:
  release:
    name: Upload PHAR and signature
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      -
        name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.3
          coverage: none
          ini-values: memory_limit=512M, opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=100M
          tools: 'composer'
        env:
          # This is necessary when installing a tool with a specific version
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      -
        name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      -
        name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      -
        name: Build PHAR
        run: make compile

      -
        name: Sign the PHAR
        run: |
          gpg --local-user maks.rafalko@gmail.com \
              --yes \
              --passphrase="${{ secrets.GPG_PASSPHRASE }}" \
              --detach-sign \
              --output dist/infection.phar.asc \
              dist/infection.phar

      - name: Publish release with PHAR (see doc/releasing.md)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Fails the job on API errors instead of treating them as "no release".
          releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.tag_name == env.GITHUB_REF_NAME) | "\(.id) \(.draft)"')"

          if grep -q ' false$' <<< "$releases"; then
            echo "::error::Release ${GITHUB_REF_NAME} is already published."
            exit 1
          fi

          drafts="$(grep -c ' true$' <<< "$releases" || true)"

          case "$drafts" in
            0) release_id="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
                 -f tag_name="${GITHUB_REF_NAME}" -f name="${GITHUB_REF_NAME}" \
                 -F draft=true -F generate_release_notes=true --jq .id)" ;;
            1) release_id="${releases%% *}" ;;
            *) echo "::error::Found ${drafts} drafts for ${GITHUB_REF_NAME}, expected one."
               exit 1 ;;
          esac

          # Unambiguous now that exactly one draft exists for the tag.
          gh release upload "${GITHUB_REF_NAME}" dist/infection.phar dist/infection.phar.asc --clobber
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -F draft=false -f make_latest=legacy > /dev/null
